services:
  ocr:
    build: ./ocr
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: ./api
    environment:
      OCR_URL: http://ocr:5000/extract
      DATA_DIR: /data
    volumes:
      - captures:/data
    depends_on:
      ocr:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
  web:
    build: ./web
    environment:
      API_TARGET: http://api:8000
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      api:
        condition: service_healthy

volumes:
  captures:
